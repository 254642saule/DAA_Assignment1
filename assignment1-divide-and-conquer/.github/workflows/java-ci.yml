name: Java correctness checks

on:
  push:
    branches: [main, 'ci/**', 'feat/**', 'fix/**', 'docs/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Java 17 on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Compile, run correctness tests and package
        run: mvn --batch-mode --no-transfer-progress clean verify
      - name: Run the packaged demonstration
        run: java -Xms128m -Xmx512m -jar target/assignment1-divide-and-conquer-1.0.0.jar demo
